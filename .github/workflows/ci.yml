# Runs on every push and pull request. No secrets needed: tests use a scripted LLM.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock.txt
            backend/requirements-dev.txt
      - name: Install
        run: pip install -r requirements.lock.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q

  frontend:
    name: Frontend lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds and serves
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t datapilot:ci .
      - name: Smoke test
        run: |
          docker run -d --name dp -p 8000:8000 datapilot:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8000/ | grep -q '<title>DataPilot</title>'
          test "$(docker exec dp whoami)" = "datapilot"
          test "$(docker exec dp sh -c 'find / -name .env -not -path "/proc/*" 2>/dev/null | wc -l')" = "0"
      - name: Logs on failure
        if: failure()
        run: docker logs dp || true
